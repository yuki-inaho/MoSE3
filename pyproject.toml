[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mose3"
version = "0.1.0"
description = "MoSE3: Learning World-Space SE(3) at Every Pixel"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE", "licenses/*"]
dependencies = [
    "torch==2.6.0",
    "numpy",
    "opencv-python",
    "imageio",
    "imageio-ffmpeg",
    "safetensors",
    "huggingface_hub",
]

[project.optional-dependencies]
demo = ["viser"]
app = ["gradio"]
test = ["pytest", "playwright"]

[tool.setuptools.packages.find]
include = ["mose3*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests that need the model weights in ckpt/ and a CUDA GPU",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
